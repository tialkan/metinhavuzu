server_tokens off;
gzip on;
gzip_types application/javascript text/css application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Güvenlik başlıkları (webtasarim.md 54-57). HSTS önizleme bitince uzatılır; includeSubDomains/preload elle karar.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # Telifli içerik paylaşılan önbelleğe (Cloudflare dahil) girmez; yalnız kullanıcının tarayıcısı saklar.
    add_header Cache-Control "private, max-age=3600" always;

    location = /saglik { auth_basic off; access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /robots.txt { auth_basic off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    # Site herkese açık (24 Kasım 2026 kararı). Parola yalnız etiket kaydında: /kayit/ altı.
    # PAROLA_KULLANICI ve PAROLA verilirse 40-parola.sh /tmp/parola.conf'u doldurur.

    # Giriş: tarayıcı parolayı /kayit/ alanı için hatırlar, sonra etiket sayfasına döner.
    location = /kayit/giris {
        include /tmp/kaynak.conf;
        include /tmp/parola.conf;
        include /tmp/kayit.conf;
        alias /usr/share/nginx/html/giris.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/basliklar.inc;
    }

    # Etiket kayıtları: /kayit/<ad>.conllu okunur ve PUT ile yazılır; liste JSON. Kalıcı disk: /srv/kayit (Coolify birimi).
    # Parola koruması kapalıysa 40-parola.sh /tmp/kayit.conf'a "return 403;" yazar: parolasız sitede yazma olmaz.
    location = /kayit/ {
        alias /srv/kayit/;
        include /tmp/kaynak.conf;
        include /tmp/parola.conf;
        include /tmp/kayit.conf;
        limit_except GET { deny all; }
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/basliklar.inc;
    }
    location ~ "^/kayit/([a-z0-9-]{1,60}\.conllu)$" {
        alias /srv/kayit/$1;
        include /tmp/kaynak.conf;
        include /tmp/parola.conf;
        include /tmp/kayit.conf;
        limit_except GET PUT { deny all; }
        dav_methods PUT;
        dav_access user:rw;
        create_full_put_path off;
        client_max_body_size 4m;
        client_body_temp_path /tmp/kayit-gecici;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/basliklar.inc;
    }
    location /kayit/ { return 404; }

    location ~ /\. { deny all; }
    location = /index.html { include /tmp/kaynak.conf; add_header Cache-Control "private, no-cache" always; include /etc/nginx/conf.d/basliklar.inc; }
    location / { include /tmp/kaynak.conf; try_files $uri $uri/ =404; }
    error_page 404 /index.html;
}
